schema_version = 1

[routing]
default_engine = "auto"
default_provider = "minimax"
default_model = "MiniMax-M3"

[limits]
max_m3_attempts_per_task = 2
# Egy első, magas-kockázatú eszkaláció után a független review konkrét
# BLOCKER/MAJOR lelete egyetlen, review-gated Terra javító hívást kaphat.
max_terra_calls_per_task = 2
# 0 = korlátlan; pozitív érték = ideiglenes, véges UTC-napi vészkorlát.
max_automatic_terra_calls_per_utc_day = 0
terra_reasoning = "medium"
terra_packet_target_tokens = 40000
terra_packet_max_bytes = 81920

[runtime]
state_dir = "~/.local/state/strumsight-ai-router"
quota_helper = "~/.local/libexec/strumsight-ai/minimax-quota"
gate_script = "tools/round-gate.sh"
codex_bin = "codex"
m3_profile = "m3"
terra_profile = "terra"
model_timeout_seconds = 7200
gate_timeout_seconds = 3600

[security]
protected_paths = [
  ".git",
  ".ai/router.toml",
  ".pipeline",
  "docs/execution/pipeline-queue.tsv",
  "tools/model-router.py",
  "tools/ai_router",
]
high_risk_path_fragments = [
  "auth",
  "authorization",
  "credential",
  "crypto",
  "encryption",
  "migration",
  "payment",
  "secret",
]
native_gate_command = ["flutter", "build", "apk", "--debug"]
