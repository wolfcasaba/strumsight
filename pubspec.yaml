name: strumsight
description: "StrumSight — offline, on-device guitar chord & strum-direction detection"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Detection is 100% on-device: audio never leaves the phone, and logged out /
# account-disabled the app makes ZERO network requests (offline_network_guard
# test). Network deps (dio, flutter_secure_storage) serve only the OPTIONAL
# account layer (login + settings sync, backend/). The inherited
# recipewiser-mobile plugin set has been pruned to what StrumSight needs.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  meta: ^1.16.0                 # @immutable for the Flutter-free core domain
                                # (lib/core/music/) — see docs/adr/0057
  audio_streamer: ^4.3.0        # mic → PCM stream (real engine — RAG chunk 001)
  fftea: ^1.5.0                 # pure-Dart FFT/STFT (DSP core — see docs/rag)
  flutter_riverpod: ^3.3.2      # state (hand-written providers, no codegen)
  permission_handler: ^12.0.0   # RECORD_AUDIO runtime permission
  go_router: ^17.3.0            # navigation shell
  wakelock_plus: ^1.6.1         # keep the screen awake during a Live session
  audioplayers: ^6.8.0          # tuner reference tone / metronome click
  shared_preferences: ^2.3.2    # persist settings (theme, language, threshold)
  package_info_plus: ^10.1.0    # app version on the Settings screen
  flutter_animate: ^4.5.2       # declarative UI motion (Live chord timeline, r185)

  # OPTIONAL account layer (login + cloud settings sync). Detection stays
  # 100% offline; the app is fully usable logged-out. See backend/.
  dio: ^5.7.0                   # HTTP client for the account API
  flutter_secure_storage: ^10.3.1 # store the JWT (Keystore/Keychain); v10 keeps
                                  # win32 ^6 — ONE win32 major across the tree
  share_plus: ^13.2.0
  flutter_local_notifications: ^22.0.1 # opt-in daily practice nudge (round 80)
  flutter_timezone: ^5.1.0      # device tz name for the 19:00 wall-time nudge
  timezone: ^0.11.1             # TZDateTime scheduling
  xml: ^6.6.1                   # MusicXML parser at the data-layer boundary
  archive: ^4.0.7               # secure MXL container inspection
  crypto: ^3.0.7                # source SHA-256 provenance
  file_selector: ^1.1.0         # AGP-compatible platform file selection behind Song Trainer adapter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Generate localizations (AppLocalizations) from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true

  assets:
    # Curated, reviewed tutor knowledge documents and their manifest.
    - assets/tutor_knowledge/
    # Versioned, trusted system templates for AI Tutor prompt composition.
    - assets/tutor_prompts/
    # Trained strum-direction CRNN weights (pure-Dart inference, round 163).
    - assets/ml/strum_crnn.bin
    # The 70 ms-deadline LIVE variant (round 168; serve-chain 79.8% real).
    - assets/ml/strum_crnn_live.bin
    # The 3-class LIVE variant (round 175: down/up + learned no-strum reject
    # → false-onset arrow suppression). Preferred over the 2-class asset.
    - assets/ml/strum_crnn_live_3c.bin
    # Full-band CHORD-recognition CRNN (CCRN blob, round 195 export; CQT→CNN→
    # BiGRU→25-class majmin). Pure-Dart inference feeds the Viterbi decoder.
    - assets/ml/chord_crnn.bin

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
