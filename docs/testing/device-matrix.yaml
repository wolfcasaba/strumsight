# Restricted YAML subset ONLY — no anchors/aliases, no multi-line scalars, no
# flow maps, no tabs. The exact grammar this file must stay inside (2-space
# list indentation, "key: value" pairs, inline "[a, b]" lists, "#" comments)
# is documented as the editability contract in docs/testing/device-lab.md §3,
# because that grammar is what test/tooling/device_matrix_test.dart's
