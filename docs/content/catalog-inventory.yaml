# Content-catalog inventory (E12-R21, ADR 0485).
#
# A MIRROR of the three places learner content actually lives on this tree —
# never a canonical source itself (ADR 0485 D1). `tool/validate_content_
# catalog.py` reads this file with its own strict, fail-closed line parser
# (no `package:yaml` dependency is guaranteed on the runner, R7) and measures
# it BOTH ways against the real Dart/JSON sources: every measured element
# needs an inventory line (`missing_inventory_entry`), and every inventory
# line needs a measured element (`stale_inventory_entry`). Edit the SOURCE
# first, then this file — never the reverse.
#
# Run: python3 tool/validate_content_catalog.py --inventory
# docs/content/catalog-inventory.yaml --today YYYY-MM-DD
