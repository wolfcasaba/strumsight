known_exceptions:
  - id: practice-catalog-description-key-missing-both-locales
    reason: "All 10 builtin practice descriptionKey ARB entries (practiceCatalog*Description) are absent from both lib/l10n/app_en.arb and lib/l10n/app_hu.arb; only the titleKey half of each pair resolves today (brief R4). Fixing requires editing lib/l10n/**, which is this round's tilos zona (D7) — tracked here as a GA-blocking gap, not fixed."
    owner: strumsight-content
    expiry: "2026-12-31"
    suppresses: locale:practice_engine:descriptionKey
  - id: learn-lesson-name-hardcoded-english
    reason: "Lesson.name (lib/features/learn/model/lesson.dart) is a plain hardcoded English string across all 16 Lessons.all entries plus firstWin — there is no ARB indirection and no hu surface at all. Fixing requires editing lib/features/learn/**, which is this round's tilos zona (D7) — tracked here as a GA-blocking gap, not fixed."
    owner: strumsight-content
    expiry: "2026-12-31"
    suppresses: locale:learn_lessons:name
