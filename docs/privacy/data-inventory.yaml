# Privacy data inventory (E12-R17, ADR 0479)
#
# Machine-checked by tool/check_data_inventory.dart (test/tooling/data_inventory_test.dart
# is the CI-visible gate). The checker does NOT trust this file — it independently
# walks lib/** for every class that actually touches an HTTP transport (ADR 0479 D1)
# and requires a `source:` entry below for each one it finds. Do not add a route here
# that the tree does not also produce; do not remove one the tree still produces.
#
# `wired: false` routes are real code paths with NO production construction site in
# lib/** yet (measured — grep finds no caller). Their `fields` describe what WOULD
# leave the device once a future round wires them; `leaves_device` stays `false`
# until that happens, because today nothing on that path reaches the network.
#
# Schema (enforced by A1, test/tooling/data_inventory_test.dart):
#   route:  id, source, file, wired (bool), gate, consent_switch, fields (>=1)
#   field:  name, purpose, legal_basis, retention, storage, leaves_device (bool)

routes:
  - id: account_api
    source: "DioFactory.createAccountClient"
    file: "lib/core/network/dio_factory.dart:32"
    wired: true
    gate: "FeatureFlags.accountEnabled at client construction, plus a per-request auth session-generation check"
    consent_switch: "auth session-generation (_AuthSessionGeneration.advance / _AuthSessionCredentials.clear in lib/features/auth/providers/auth_providers.dart), read per-request by AuthInterceptor.onRequest (lib/core/network/auth_interceptor.dart:50,73) — a cleared/stale generation rejects the request before it reaches the transport adapter"
    fields:
      - name: "email"
        purpose: "account authentication — login/register identifier"
        legal_basis: "contract"
        retention: "backend, for the lifetime of the account (backend/** has no measured client-triggered account-deletion endpoint as of this round)"
        storage: "backend"
        leaves_device: true
      - name: "password"
        purpose: "account authentication — login/register credential"
        legal_basis: "contract"
        retention: "backend, per the account service's own hashing/storage policy (out of this client-side round's scope)"
        storage: "backend"
        leaves_device: true
      - name: "settings_profile (theme_mode, locale, confidence_threshold, tuning_a4)"
        purpose: "cross-device settings sync for a signed-in user (lib/features/settings/providers/settings_sync.dart)"
        legal_basis: "contract"
        retention: "backend, replaced on every confirmed push; kept for the lifetime of the account"
        storage: "device (local settings, always) and backend (synced copy, only while signed in)"
        leaves_device: true
      - name: "community_profile (handle, display_name, visibility, audience_default)"
        purpose: "public community identity created when the user opts into Community"
        legal_basis: "contract"
        retention: "backend, for the lifetime of the account/profile"
        storage: "backend"
        leaves_device: true
      - name: "community_social_graph (follow/unfollow/block/mute target ids)"
        purpose: "social-graph edges the user creates by interacting with Community"
        legal_basis: "contract"
        retention: "backend, for the lifetime of the relationship record"
        storage: "backend"
        leaves_device: true
      - name: "community_challenge_activity (invite/accept/decline/cancel/submit_result payloads)"
        purpose: "challenge participation state"
        legal_basis: "contract"
        retention: "backend, for the lifetime of the challenge/account"
        storage: "backend"
        leaves_device: true

  - id: diagnostics_upload
    source: "DioFactory.createDiagnosticsClient"
    file: "lib/core/network/dio_factory.dart:51"
    wired: true
    gate: "FeatureFlags.diagnosticsEnabled at client construction, AND diagnosticsConsentProvider (default false, fail-closed) re-read at every upload call"
    consent_switch: "diagnosticsConsentProvider (lib/features/diagnostics/providers/diagnostics_providers.dart:16) — read by DiagnosticsUploadNotifier.upload before building the session, and re-checked as the consentGranted argument inside DiagnosticsUploader.upload (lib/features/diagnostics/data/diagnostics_uploader.dart:52)"
    fields:
      - name: "ml_dsp_comparison_events (tSec, mlChord, dspChord, agree, mlConf, dspConf, strumDir, bpm, inputLevel)"
        purpose: "Lab-mode ML-vs-DSP chord-detection diagnostics, explicitly opted into"
        legal_basis: "consent"
        retention: "backend; the upload is a one-shot best-effort POST with no client-measured deletion path"
        storage: "backend"
        leaves_device: true
      - name: "audio_clip (raw 16-bit WAV, base64, decimated to fit a ~5MB pre-encode cap)"
        purpose: "the recorded clip a diagnostics event was measured from, for offline model debugging"
        legal_basis: "consent"
        retention: "backend; no client-measured deletion path"
        storage: "backend"
        leaves_device: true
      - name: "device_metadata (appVersion, device platform string)"
        purpose: "diagnostics correlation — which build/platform produced the session"
        legal_basis: "consent"
        retention: "backend, tied to the diagnostics session record"
        storage: "backend"
        leaves_device: true

  - id: tutor_stream
    source: "HttpTutorStreamTransport"
    file: "lib/features/ai_tutor/data/model_gateway/http_tutor_stream_transport.dart:16"
    wired: false
    gate: "TutorConsent.modelUseGranted — enforced on the turn path by reduceTutorTurn (lib/features/ai_tutor/application/orchestration/tutor_orchestrator.dart:47) before any gateway is created; LocalTutorFallback (lib/features/ai_tutor/application/offline/local_tutor_fallback.dart:120) mirrors the same check for the offline capability summary. There is today no lib/** call site that constructs an HttpTutorStreamTransport — the turn path only ever runs a local/fake gateway."
    consent_switch: "TutorConsent.modelUseGranted (lib/features/ai_tutor/domain/models/tutor_consent.dart)"
    fields:
      - name: "tutor_turn_message (student free-text message + assembled context snapshot fields)"
        purpose: "cloud-model tutor turn — POST /tutor/stream, once a production construction site exists"
        legal_basis: "consent"
        retention: "not measurable yet — no production transport construction site exists in lib/**"
        storage: "backend, once wired"
        leaves_device: false

  - id: community_media
    source: "CommunityMediaUploader"
    file: "lib/features/community/data/api/community_media_uploader.dart"
    wired: false
    gate: "none today — the uploader accepts an injected Dio; the brief's HTTP wiring (fetching the presigned-upload intent, choosing which Dio to inject) is a Kör 19+ task (ADR 0410 / ADR 0479)"
    consent_switch: "none yet — no production construction site exists; the intended gate is the same account-session mechanism the rest of Community rides on (communityApiClientProvider reuses accountApiClientProvider)"
    fields:
      - name: "community_media_bytes (image/video attachment bytes for a presigned PUT)"
        purpose: "community post/media attachment upload, once wired"
        legal_basis: "consent"
        retention: "not measurable yet — no production construction site exists in lib/**"
        storage: "backend object store, once wired"
        leaves_device: false
