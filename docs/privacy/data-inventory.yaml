  # 2026-09-06 — a poszt- és a klub-repository bekötésével KÉT új
  # ApiClient-fogyasztó egress-útvonal keletkezett (WP-B). Mindkettő az
  # `account_api`-t lovagolja: a saját provideré szó szerint tovább-exportálja
  # az `accountApiClientProvider`-t. A `fields` itt — a többi rides-útvonaltól
  # eltérően — KI VAN TÖLTVE, mert ez a két repository az egyetlen hely a
  # fában, ahol felhasználó által ÍRT szabad szöveg (poszt-törzs,
  # komment-törzs, klub-név/leírás) hagyja el az eszközt.
  - id: account_api_community_post_repository
    source: "HttpCommunityPostRepository"
    file: "lib/features/community/data/repositories/post_repository_impl.dart:189"
    wired: true
    gate: "rides account_api via communityPostApiClientProvider, which re-exports accountApiClientProvider verbatim (post_repository_impl.dart:93-95); a null client selects DisabledCommunityPostRepository, which sends nothing (post_repository_impl.dart:102-107)"
    consent_switch: "rides account_api — see that route's consent_switch"
    rides: "account_api"
    fields:
      - name: "post_body (a poszt szabad szövege — createPost/updatePost `body`)"
        purpose: "közösségi poszt létrehozása és szerkesztése — POST /community/posts, PATCH /community/posts/{id}"
        legal_basis: "consent"
        retention: "backend, a poszt rekordjához kötve a lágy törlésig"
        storage: "backend"
        leaves_device: true
      - name: "post_audience (a poszt láthatósága — `audience` wire-érték)"
        purpose: "a szerver ebből dönti el, ki láthatja a posztot"
        legal_basis: "consent"
        retention: "backend, a poszt rekordjához kötve"
        storage: "backend"
        leaves_device: true
      - name: "post_artifact (a poszthoz csatolt artefaktum JSON-payloadja — `artifact`)"
        purpose: "a poszthoz kötött gyakorlás-/elemzés-artefaktum leírója"
        legal_basis: "consent"
        retention: "backend, a poszt rekordjához kötve"
        storage: "backend"
        leaves_device: true
      - name: "comment_body (a komment szabad szövege + `parent_public_id` — createComment/updateComment)"
        purpose: "kommentelés és komment-szerkesztés — POST /community/posts/{id}/comments, PATCH /community/comments/{id}"
        legal_basis: "consent"
        retention: "backend, a komment rekordjához kötve a lágy törlésig"
        storage: "backend"
        leaves_device: true
      - name: "reaction_kind (a reakció típusa — PUT /community/posts/{id}/reaction `kind`)"
        purpose: "reakció beállítása egy poszton"
        legal_basis: "consent"
        retention: "backend, a reakció rekordjához kötve"
        storage: "backend"
        leaves_device: true
      - name: "idempotency_key / resource_version (írás-kísérlet azonosítója és optimista verzió)"
        purpose: "kétszeres beküldés és elveszett-frissítés elleni védelem"
        legal_basis: "legitimate interest — a művelet technikai helyessége"
        retention: "backend, az írási művelethez kötve"
        storage: "backend"
        leaves_device: true

