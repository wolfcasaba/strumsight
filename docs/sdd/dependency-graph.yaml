# SDD chapter dependency graph — machine-checked source of truth.
#
# ADR 0443 D3: `package:yaml` is NOT used to read this file (it is only a
# transitive dependency in pubspec.lock, and `depend_on_referenced_packages`
# would turn `flutter analyze` red on a direct import — see ADR 0443 §D3).
# This file is therefore a DELIBERATELY RESTRICTED YAML SUBSET, read by
# `tool/check_sdd_index.dart` with its own line-based parser. Only the
# following constructs are supported:
#
#   - exactly two top-level keys, in this order: `nodes:` then `edges:`
#   - list items introduced by a line that is exactly two spaces of
#     indentation followed by `- id: <chNN>` (nodes) or `- from: <chNN>`
#     (edges)
#   - scalar `key: value` pairs indented exactly four spaces, one per line,
#     immediately under the list item that introduces them
#   - node keys: `id` (required, first), `title` (quoted string),
#     `critical_path` (`true`/`false`), `capability_gated` (`true`/`false`)
#   - edge keys: `from` (required, first), `to` (required)
#
# Anything else — block scalars, flow collections (`[a, b]`, `{a: b}`),
# anchors/aliases, multi-line strings, comments after a value on the same
# line — is UNSUPPORTED. The parser reports the offending line number and
# the construct it expected when it encounters a shape it cannot read.
#
# Edge direction: `from -> to` means the chapter `to` depends on the chapter
# `from` (i.e. `from` must be complete, or at least contract-stable, before
# `to` can proceed) — the same direction as the arrows in the `00-index.md`
# "Függőségi kép" ASCII illustration, which this file supersedes as the
# checked source (ADR 0443 D2). That illustration remains in `00-index.md`
# purely as a human-readable rendering; it is not re-verified against this
# file in this round.

