# StrumSight — Data safety declaration source (E12-R24)
#
# SZÁRMAZTATOTT dokumentum (§5.1): minden `categories[].references[]` bejegyzés
# egy LÉTEZŐ `docs/privacy/data-inventory.yaml` route.id / field.name párra
# mutat. Nincs önállóan megfogalmazott kategória — ha egy kategóriát ide
# felveszel, előbb a data-inventory-ban kell léteznie a mögötte álló
# route/field-nek.
#
# Gépileg ellenőrzött: test/tooling/store_package_test.dart (A2) — kétirányban:
#   1) minden itteni `references[]` bejegyzés route.id/field.name párja
#      feloldódik a valódi docs/privacy/data-inventory.yaml-ban
#      (tool/check_data_inventory.dart DataInventory.parseFile-jával olvasva);
#   2) minden `leaves_device: true` leltár-mező szerepel legalább egy itteni
#      kategória references-listájában (nincs "elfelejtett" kategória).
#
# A `rides:` route-ok TÖBBSÉGE (account_api_auth_repository, stb.) saját `fields`
# nélküli a leltárban — a fedezetük az `account_api`/`diagnostics_upload`
# célroute-on keresztül automatikus, nincs hozzájuk külön kategória (§0.0 R4).
#
# KIVÉTEL (2026-09-06, WP-B): `account_api_community_post_repository` és
# `account_api_community_club_repository` a transzportot ugyan az `account_api`-tól
# lovagolja, de SAJÁT `fields` listát is deklarál, mert ez a két repository az
# egyetlen hely a fában, ahol felhasználó által ÍRT szabad szöveg (poszt-törzs,
# komment-törzs, klub-név/leírás) hagyja el az eszközt. Ezek `leaves_device: true`
# mezők, tehát a fenti 2) irány kategóriát KÖVETEL rájuk — lásd a fájl végén a
# `community_post_*` / `community_club_*` / `community_write_integrity`
# kategóriákat.
#
# `wired: false` route-ok mezői (`tutor_stream`.tutor_turn_message,
# `community_media`.community_media_bytes) `leaves_device: false` — ma
# semmilyen production kódút nem küldi őket a hálózatra, ezért nincs itt
# hozzájuk data-safety kategória; a `leaves_device` mező automatikusan zöldre
# vált a fedezet-ellenőrzésben (nem "true", tehát nem követel kategóriát).
#
# Restricted YAML subset — package:yaml NÉLKÜL olvasva
# (test/tooling/store_package_test.dart saját olvasója), 2-space lista-elem
# indentáció, 4-space kv, a `references:` beágyazott listája 6-space
# elem-fejléc / 8-space kv — ugyanaz a grammatika, amit
# docs/privacy/data-inventory.yaml routes/fields nesting-je használ.

schema_version: 1

categories:
  - id: account_credentials
    label: "Account credentials"
    play_category: "Personal info"
    collected: true
    shared: false
    optional: true
    purpose: "Account creation and sign-in for the optional account layer (contract, backend-side)."
    references:
      - route: account_api
        field: "email"
      - route: account_api
        field: "password"

  - id: settings_sync
    label: "Synced app settings"
    play_category: "App info and performance"
    collected: true
    shared: false
    optional: true
    purpose: "Cross-device settings sync for a signed-in user."
    references:
      - route: account_api
        field: "settings_profile (theme_mode, locale, confidence_threshold, tuning_a4)"

  - id: community_identity
    label: "Community profile"
    play_category: "Personal info"
    collected: true
    shared: false
    optional: true
    purpose: "Public community identity created only when the user opts into Community."
    references:
      - route: account_api
        field: "community_profile (handle, display_name, visibility, audience_default)"

  - id: community_social_graph
    label: "Community connections"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "Social-graph edges (follow/unfollow/block/mute) the user creates by interacting with Community."
    references:
      - route: account_api
        field: "community_social_graph (follow/unfollow/block/mute target ids)"

  - id: community_challenge_activity
    label: "Community challenge activity"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "Challenge participation state (invite/accept/decline/cancel/submit_result)."
    references:
      - route: account_api
        field: "community_challenge_activity (invite/accept/decline/cancel/submit_result payloads)"

  - id: diagnostics_comparison_events
    label: "Diagnostics: ML/DSP comparison events"
    play_category: "App info and performance"
    collected: true
    shared: false
    optional: true
    purpose: "Lab-mode ML-vs-DSP chord-detection diagnostics, explicitly opted into (diagnosticsConsentProvider, default false)."
    references:
      - route: diagnostics_upload
        field: "ml_dsp_comparison_events (tSec, mlChord, dspChord, agree, mlConf, dspConf, strumDir, bpm, inputLevel)"

  - id: diagnostics_audio_clip
    label: "Diagnostics: audio clip"
    play_category: "Audio files"
    collected: true
    shared: false
    optional: true
    purpose: "The recorded clip a diagnostics event was measured from, for offline model debugging (Lab-mode opt-in only)."
    references:
      - route: diagnostics_upload
        field: "audio_clip (raw 16-bit WAV, base64, decimated to fit a ~5MB pre-encode cap)"

  - id: diagnostics_device_metadata
    label: "Diagnostics: device metadata"
    play_category: "Device or other IDs"
    collected: true
    shared: false
    optional: true
    purpose: "Diagnostics correlation — which app build/platform produced the session (Lab-mode opt-in only)."
    references:
      - route: diagnostics_upload
        field: "device_metadata (appVersion, device platform string)"

  - id: share_card_image
    label: "User-initiated share: card image"
    play_category: "Photos or videos"
    collected: true
    shared: false
    optional: true
    purpose: "User-chosen share of a rendered practice card image to an OS-level destination app the user picks; StrumSight has no further custody once the OS share intent completes."
    references:
      - route: share_export
        field: "strum_card_png (rendered on-screen 'Strum Card' capture)"

  - id: share_caption
    label: "User-initiated share: caption text"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "The social caption accompanying a user-initiated share."
    references:
      - route: share_export
        field: "share_caption (chords, strum-glyph sequence, BPM, optional session title only if includeTitle=true, install link, hashtags)"

  - id: share_export_json
    label: "User-initiated share: analysis export"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "User-initiated JSON export/share of an analysis session, after an explicit preview + confirm step (ADR 0247); RedactionPolicy-filtered allowlist, not the raw internal document."
    references:
      - route: share_export
        field: "redacted_analysis_export_json (RedactionPolicy-filtered allowlist view of an AnalysisDocument)"

  # 2026-09-06 (WP-B) — a poszt- és klub-repository bekötésével keletkezett
  # 12 új `leaves_device: true` leltár-mező fedezete. A két route a
  # transzportot az `account_api`-tól lovagolja, de saját mezői vannak, ezért
  # saját kategóriákat is követel (lásd a fejléc KIVÉTEL bekezdését).

  - id: community_post_content
    label: "Community posts and comments"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "Free-text post and comment bodies the user writes in Community — the only user-authored prose the app sends to the backend. Created only by an explicit compose/send action while signed in."
    references:
      - route: account_api_community_post_repository
        field: "post_body (a poszt szabad szövege — createPost/updatePost `body`)"
      - route: account_api_community_post_repository
        field: "comment_body (a komment szabad szövege + `parent_public_id` — createComment/updateComment)"

  - id: community_post_audience
    label: "Community post audience setting"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "The visibility/audience value the user picks for a post; the server uses it to decide who may see that post."
    references:
      - route: account_api_community_post_repository
        field: "post_audience (a poszt láthatósága — `audience` wire-érték)"

  - id: community_post_artifact
    label: "Community post attachment descriptor"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "The practice/analysis artifact descriptor a user attaches to a post (a JSON payload describing the attached session, not raw audio)."
    references:
      - route: account_api_community_post_repository
        field: "post_artifact (a poszthoz csatolt artefaktum JSON-payloadja — `artifact`)"

  - id: community_post_reaction
    label: "Community reactions"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "Which reaction kind the user set on which post — an explicit tap, sent only while signed in."
    references:
      - route: account_api_community_post_repository
        field: "reaction_kind (a reakció típusa — PUT /community/posts/{id}/reaction `kind`)"

  - id: community_club_identity
    label: "Community club name and description"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "Free-text club name and description the user writes when creating or editing a club."
    references:
      - route: account_api_community_club_repository
        field: "club_name (a klub neve — createClub `name`)"
      - route: account_api_community_club_repository
        field: "club_description (a klub szabad szövegű leírása — createClub/updateClub `description`)"

  - id: community_club_audience
    label: "Community club visibility setting"
    play_category: "App activity"
    collected: true
    shared: false
    optional: true
    purpose: "The visibility value the user picks for a club; the server uses it to decide who may see and join that club."
    references:
      - route: account_api_community_club_repository
        field: "club_visibility (a klub láthatósága — `visibility` wire-érték)"

  - id: community_club_membership_targets
    label: "Community club membership target profile ids"
    play_category: "Personal info"
    collected: true
    shared: false
    optional: true
    purpose: "The public profile id of the person a user invites, promotes to owner, or removes from a club, plus the club-membership action targets carried in the request path (join/leave/member removal)."
    references:
      - route: account_api_community_club_repository
        field: "target_public_id (meghívott, illetve új tulajdonos publikus profil-azonosítója — inviteMember `target_public_id`, transferOwnership `target_public_id`)"
      - route: account_api_community_club_repository
        field: "club_membership_action (csatlakozás/kilépés/tag-eltávolítás cél-azonosítói az útvonalban — /join, /leave, /members/{id})"

  - id: community_write_integrity
    label: "Community write-integrity identifiers"
    play_category: "App info and performance"
    collected: true
    shared: false
    optional: true
    purpose: "App-functionality identifiers only: a per-attempt idempotency key (double-submit protection) and an optimistic resource version (lost-update protection). They identify the write attempt, not the user."
    references:
      - route: account_api_community_post_repository
        field: "idempotency_key / resource_version (írás-kísérlet azonosítója és optimista verzió)"
      - route: account_api_community_club_repository
        field: "idempotency_key (írás-kísérlet azonosítója)"
