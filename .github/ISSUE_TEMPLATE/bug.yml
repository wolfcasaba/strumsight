name: "Bug report"
description: "Hibajelenteshez - meglevo viselkedes nem a vart szerint mukodik"
title: "[Bug] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: "A kotelezo mezokrol lasd docs/process/backlog-policy.md."
  - type: input
    id: chapter
    attributes:
      label: "Chapter / SDD terulet"
      description: "Melyik SDD fejezet vagy terulet erintett"
      placeholder: "pl. Chapter 03 - Practice Engine"
    validations:
      required: true
  - type: input
    id: round
    attributes:
      label: "Kor-azonosito"
      description: "Melyik kor vezette be a hibat, ha ismert; egyebkent nincs meg kiosztva"
      placeholder: "pl. E03-R09"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "docs/release/blockers.md Severity-skala"
      options:
        - "P0"
        - "P1"
        - "P2"
        - "P3"
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: "Reprodukcios lepesek"
      description: "Pontos lepesek, elvart es tenyleges eredmeny"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Mikor tekintheto a hiba javitottnak"
    validations:
      required: true
  - type: textarea
    id: test_plan
    attributes:
      label: "Teszt terv"
      description: "Pontos tesztparancsok, amikkel a javitas bizonythato"
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: "Rollback terv"
      description: "Hogyan vonhato vissza a javitas, ha problema merul fel"
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: "Privacy / security hatas"
      description: "secret, PII, permission, log-tartalom hatasa - vagy nincs"
    validations:
      required: true
