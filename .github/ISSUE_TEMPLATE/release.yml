name: "Release checklist"
description: "Kiadasi (release) elokeszites vagy release-blokkolo kovetese"
title: "[Release] "
labels:
  - release
  - needs-triage
body:
  - type: markdown
    attributes:
      value: "A kotelezo mezokrol lasd docs/process/backlog-policy.md. Release asset valtozast mindig magyarazd meg."
  - type: input
    id: chapter
    attributes:
      label: "Chapter / SDD terulet"
      description: "Melyik SDD fejezet vagy terulet erintett"
      placeholder: "pl. Chapter 12 - Release Roadmap"
    validations:
      required: true
  - type: input
    id: round
    attributes:
      label: "Kor-azonosito"
      description: "Ha mar kiosztott kor, az azonositoja; egyebkent nincs meg kiosztva"
      placeholder: "pl. E12-R05"
    validations:
      required: true
  - type: textarea
    id: release_assets
    attributes:
      label: "Erintett release asset-ek"
      description: "android/ alairas-konfig, verzioszam, store-metaadat, docs/release/** bizonyitek - vagy nincs"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Merheto elfogadasi kriteriumok"
    validations:
      required: true
  - type: textarea
    id: test_plan
    attributes:
      label: "Teszt terv"
      description: "Pontos tesztparancsok, amikkel a lezaras bizonythato"
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: "Rollback terv"
      description: "Hogyan vonhato vissza a kiadas, ha problema merul fel"
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: "Privacy / security hatas"
      description: "secret, PII, permission, log-tartalom hatasa - vagy nincs"
    validations:
      required: true
