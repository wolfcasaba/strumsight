name: Build Android APK

# A kör build-evidenciájának EGYETLEN forrása a kör-branchre dispatchelt futás
# (ADR 0052 §1). A `main`-re szóló automatikus push-trigger megszűnt
# (ADR 0086), mert körönként két felesleges ~10 perces futást indított: a
# squash-merge ugyanazt a fát állítja elő, amit a branch-futás már gate-elt, a
# HANDOFF/docs commit pedig egyetlen buildbe kerülő bájtot sem érint.
# Cserébe KÖTELEZŐ (ADR 0086 §2): dispatch előtt a branch legyen naprakész az
# `origin/main`-nel, és ha a `main` a dispatch UTÁN mozdult, a merge előtt újra
# kell dispatch-elni — ez zárja azt a rést, amit korábban a main-futás fedett.
on:
  workflow_dispatch:

# Ugyanarra a refre indított újabb futás (pl. javító kör utáni újra-dispatch)
# érvényteleníti a korábbit — a merge kapuja mindig a legfrissebb fa.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Run Flutter quality gates
        uses: ./.github/actions/flutter-gates
      - name: Song schema snapshot gate
        run: dart run tool/ci/check_song_schema.dart
      - name: Song fixture provenance gate
        run: dart run tool/ci/check_song_fixture_licenses.dart
      - name: Read APK metadata from pubspec
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          version_value="$(
            sed -nE \
              's/^version:[[:space:]]*([^[:space:]#]+).*$/\1/p' \
              pubspec.yaml
          )"
          if [[ ! "$version_value" =~ ^([0-9A-Za-z][0-9A-Za-z._-]*)\+([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml must contain exactly one version in <version>+<buildNumber> form."
            exit 1
          fi
          app_version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          short_sha="${GITHUB_SHA:0:7}"
          artifact_name="strumsight-${app_version}-${build_number}-${short_sha}-development.apk"
          printf 'name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
      # Development release-mode APK: debug signing remains intentional so
      # round builds are directly sideloadable without production secrets.
      - name: Build development APK
        run: >-
          flutter build apk --release
          --dart-define=STRUMSIGHT_ENV=development
      - name: Stage versioned APK
        env:
          ARTIFACT_NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "::error::Development APK is missing or empty."
            exit 1
          fi
          mkdir -p dist
          cp -- "$source_apk" "dist/$ARTIFACT_NAME"
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test coverage gate
        run: flutter test --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: strumsight-coverage-${{ github.run_id }}
          path: coverage/lcov.info
          if-no-files-found: error
