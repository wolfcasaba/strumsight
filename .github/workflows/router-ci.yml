name: Router CI

# A MiniMax-first fejlesztési router (ADR 0088) saját teszt-sávja.
#
# MIÉRT KELL: a router `tools/round-gate.sh`-t hív és eldönti, melyik modell
# dolgozik — vagyis MAGA a mérce egy darabja. A repó Flutter-gate-je (ADR 0052)
# Dart-only, ezért a router 87 Python-tesztje enélkül SEMMILYEN automatikus
# ellenőrzés alatt nem állna: a mércét mérnie kell valaminek.
#
# A router stdlib-only (Python 3.11+ a `tomllib` miatt), ezért a futáshoz nincs
# külső függőség — a CI csak a `pytest`-et telepíti.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ai_router/**"
      - "tools/model-router.py"
      - "tools/minimax-quota.py"
      - "tools/openspace-vm-wrapper.py"
      - "tools/tests/**"
      - "tools/round-gate.sh"
      - "tools/round-pipeline.sh"
      - "tools/pipeline-status.sh"
      # ADR 0171 áteresztő-képesség eszközei: a CI-terv, a brief-lint, a
      # slot-tervező és az időmérleg maga is a mérce része (a CI-terv dönti
      # el, melyik workflow a kapu), ezért ugyanez a sáv méri őket.
      - "tools/round-ci-plan.py"
      - "tools/brief-lint.py"
      - "tools/brief-merge-plan.py"
      - "tools/round-slots.py"
      - "tools/round-metrics.py"
      - "tools/round-merge-lock.sh"
      - ".github/workflows/full-gate.yml"
      - ".ai/**"
      - ".github/workflows/router-ci.yml"
      # A tools/tests a kör-briefek és a pipeline-sor metaadatait IS méri
      # (test_epic3_brief_metadata.py, test_pipeline_integration.py), ezért egy
      # docs-only kör is pirosra állíthatja a suite-ot anélkül, hogy ez a
      # workflow lefutna. Mérve 2026-08-02: az E03-R03 briefjének `allowed_paths`
      # drift-je a merge után négy körön át észrevétlen maradt.
      - "docs/rounds/**"
      - "docs/execution/pipeline-queue.tsv"
      - "docs/execution/pipeline-orchestrator-prompt.md"
      - "docs/execution/pipeline-selfheal-prompt.md"
      - "docs/execution/pipeline-codex-orchestrator-preamble.md"
      # --- Implementer-burkolók és motor-konfiguráció (2026-08-18) ----------
      # MÉRT rés: ez a 17 útvonal mind olyan fájl, amire a `tools/tests`
      # csomag HIVATKOZIK (tehát van rá guard-teszt), de a szűrőben nem
      # szerepelt — így egy őket módosító PR-en a Router CI EL SEM INDULT.
      # Konkrét eset: a PR #298 a `tools/mm-round.sh` engedélyezett
      # eszközlistáját és az `engine-registry.tsv` időkorlátját írta át, és
      # nulla CI futott rá. A listát a
      # `tools/tests/test_router_ci_path_filter.py` őrzi, hogy ne rothadjon
      # vissza; újraméréshez futtasd azt a tesztet.
      - "tools/mm-round.sh"
      - "tools/codex-round.sh"
      - "tools/codex-signal.sh"
      - "tools/ai-router-round.sh"
      - "tools/engine-profile.sh"
      - "tools/scope-audit.py"
      # --- Implementer-őrök (ADR 0309) -------------------------------------
      # A hook, a settings és az ügynök-definíció a kör-szerződés mérésének
      # része; a `tools/tests/test_implementer_guard.py` hivatkozik rájuk.
      - "tools/hooks/**"
      - "tools/implementer-settings.json"
      - "tools/implementer-agents.json"
      # Tudás-RAG (ADR 0312): a darabolás, a frissesség-jelzés és a bekötés
      # mind mért viselkedés, guard-teszttel — a szűrőnek indulnia kell rájuk.
      - "tools/knowledge-rag.mjs"
      - "tools/round-scope-audit.sh"
      - "tools/safe-force-push.sh"
      - "tools/fix-workspace-origin.sh"
      - "tools/prepare-flutter-generated.sh"
      - "tools/wait-for-ci.sh"
      - "tools/wait-for-round.sh"
      - "tools/wait-for-router.sh"
      - "docs/execution/engine-registry.tsv"
      - "docs/execution/implementer-preamble*.md"
      - "docs/execution/02-codex-playbook.md"
      - "docs/execution/06-requirements-traceability-matrix.md"

permissions:
  contents: read

jobs:
  router-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Router test gate
        run: python -m pytest tools/tests -q

      - name: Router CLI smoke gate
        run: PYTHONPATH=tools python3 tools/model-router.py --help

      # ADR 0171 §4 — a MÉG NYITOTT körök briefjeinek base-szintű lintje.
      # A hatókör szándékosan a jövő: a merge-elt körök briefje történeti
      # rekord, azt visszamenőleg nem linteljük. A base szint csak
      # bizonyítottan hibás alakot tilt (nem elemezhető ai-router blokk, nem
      # létező gate_test, hiányzó gate-artefaktum, csonkoló parancsalak),
      # ezért egy piros itt MINDIG valódi drift.
      - name: Round brief lint gate (open rounds)
        run: python3 tools/brief-lint.py --open --level base
