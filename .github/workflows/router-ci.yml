name: Router CI

# A MiniMax-first fejlesztési router (ADR 0088) saját teszt-sávja.
#
# MIÉRT KELL: a router `tools/round-gate.sh`-t hív és eldönti, melyik modell
# dolgozik — vagyis MAGA a mérce egy darabja. A repó Flutter-gate-je (ADR 0052)
# Dart-only, ezért a router 87 Python-tesztje enélkül SEMMILYEN automatikus
# ellenőrzés alatt nem állna: a mércét mérnie kell valaminek.
#
# A router stdlib-only (Python 3.11+ a `tomllib` miatt), ezért a futáshoz nincs
# külső függőség — a CI csak a `pytest`-et telepíti.

on:
  workflow_dispatch:
  push:
    paths:
      # Családi glob, NEM fájlonkénti felsorolás (2026-08-19). MÉRT ok: a
      # fájlonkénti lista karbantartási adósság — minden új, teszt által
      # hivatkozott tools/ fájl kimarad belőle, a guard-teszt
      # (tools/tests/test_router_ci_path_filter.py) pirosra vált, és a javítás
      # helye ÉPPEN EZ A FÁJL, ami a self-heal abszolút tiltott zónája
      # (ADR 0112 §3). Ez állította meg a láncot az E99-R16/H3-ban, a pipeline
      # ELSŐ escalate-jével (docs/LESSONS.md L322): 3 önjavító kísérlet,
      # ~1h40m állás, egyetlen hiányzó sorért.
      #
      # A glob a HIBAOSZTÁLYT szünteti meg, nem a tünetet. Mérve 2026-08-19:
      # a lefedett verziókövetett fájlok száma 127 -> 143 (+16), és EGYETLEN
      # korábban lefedett fájl sem esik ki — a változás szigorúan B�VÍTŐ,
      # tehát nem gyengíti a mércét. A korábbi fájlonkénti lista indoklásai
      # (PR #298 rés, ADR 0171, ADR 0309, ADR 0312) a git blame-ben maradnak.
      - "tools/**"
      - "docs/execution/**"
      - "docs/rounds/**"
      - ".ai/**"
      - ".github/workflows/router-ci.yml"
      - ".github/workflows/full-gate.yml"

permissions:
  contents: read

jobs:
  router-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Router test gate
        run: python -m pytest tools/tests -q

      - name: Router CLI smoke gate
        run: PYTHONPATH=tools python3 tools/model-router.py --help

      # ADR 0171 §4 — a MÉG NYITOTT körök briefjeinek base-szintű lintje.
      # A hatókör szándékosan a jövő: a merge-elt körök briefje történeti
      # rekord, azt visszamenőleg nem linteljük. A base szint csak
      # bizonyítottan hibás alakot tilt (nem elemezhető ai-router blokk, nem
      # létező gate_test, hiányzó gate-artefaktum, csonkoló parancsalak),
      # ezért egy piros itt MINDIG valódi drift.
      - name: Round brief lint gate (open rounds)
        run: python3 tools/brief-lint.py --open --level base
