name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install production and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint gate
        run: python -m ruff check app tests

      - name: Ruff format gate
        run: python -m ruff format --check app tests

      - name: Backend test gate
        run: python -m pytest -q

      - name: Alembic migration gate
        env:
          STRUMSIGHT_DATABASE_URL: sqlite:///${{ runner.temp }}/strumsight-backend-${{ github.run_id }}-${{ github.run_attempt }}.db
        run: python -m alembic upgrade head
