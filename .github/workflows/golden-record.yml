name: Record goldens (gate architecture)

# Újrafelveszi a pixel-goldeneket a ZÖLD KAPU saját architektúráján
# (ubuntu-latest = x86_64, ADR 0426), és az eredményt visszacommitolja arra az
# ágra, amelyről a workflow-t indították.
#
# MIÉRT: a goldenek `LocalFileComparator`-a nulla toleranciájú, ezért egy
# szándékos UI-változás után a goldent pontosan azon az ISA-n kell felvenni,
# amelyen a kapu méri (L486, L493). A `tools/golden-x86.sh` ugyanezt teszi
# dockerrel a felhasználó boxán; ez a workflow ugyanazt a mérési helyet adja
# olyan sessionből, ahol nincs Flutter SDK (docs/execution/
# remote-container-environment.md). A MÉRCE NEM VÁLTOZIK: a felvett golden
# ugyanaz a komparátor és ugyanaz a Flutter-pin, mint a full-gate.yml-ben.
#
# HATÁR: ez a workflow NEM zöld kapu. A visszacommitolt fán a `full-gate.yml`
# (vagy `build-apk.yml`) külön futása a bizonyíték — a golden-felvétel
# önmagában csak azt rögzíti, hogy a képernyő MOST hogyan néz ki, nem azt,
# hogy jól néz ki. A review a PNG-diffen történik. Emberi engedéllyel került
# be (ADR 0112/0138 gate-edit határ, 2026-09-15).

on:
  workflow_dispatch:
    inputs:
      test_files:
        description: 'Golden test files to re-record (space-separated); empty = every matchesGoldenFile test'
        required: false
        default: ''

concurrency:
  group: golden-record-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get

      # Ugyanaz a felderítés, mint tools/golden-x86.sh-ban: minden
      # `matchesGoldenFile`-t hívó teszt-fájl — ha az input nem szűkíti.
      - name: Re-record goldens
        env:
          TEST_FILES: ${{ github.event.inputs.test_files }}
        run: |
          set -euo pipefail
          if [ -n "${TEST_FILES:-}" ]; then
            read -r -a files <<< "$TEST_FILES"
          else
            mapfile -t files < <(grep -rl matchesGoldenFile test --include='*.dart' | sort)
          fi
          printf 'golden test files: %s\n' "${#files[@]}"
          flutter test --update-goldens "${files[@]}"

      - name: Commit and push the re-recorded goldens
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A test
          if git diff --cached --quiet; then
            echo "nothing to commit — goldens already match"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore(goldens): re-record on the gate architecture (golden-record.yml)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
