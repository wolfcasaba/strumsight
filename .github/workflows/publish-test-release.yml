name: Publish test release

# Egy ZÖLD build-apk.yml futás APK-artefaktumából prerelease-t készít, amelyben
# az .apk tömörítetlenül, közvetlen letöltési linkkel szerepel.
#
# Indítás (két út):
#   1. kérésfájl: commitolj egy `.github/release-requests/<run_id>.txt` fájlt
#      (a tartalma opcionális megjegyzés a release-szöveghez) — a push
#      elindítja a publikálást azon az ágon, ahol a workflow él. Ez a MÉRT
#      működő út egy csak az ágon létező workflow-ra: a GitHub a
#      `workflow_dispatch` triggert a default ág definíciójából olvassa, a
#      push-triggert viszont a pusholt commitéból.
#   2. workflow_dispatch (run_id + notes input) — akkor, ha a fájl a main-en van.
#
# Mércék:
#   * csak `success` befejezésű build-apk.yml futásból publikál,
#   * a címke `test-<UTC dátum>-<rövid head sha>`; létező címkére NEM ír rá,
#   * a release a futás head-sha-jára mutat, prerelease, a leírásban a futás
#     azonosítója és az APK SHA-256 ujjlenyomata.
on:
  push:
    paths:
      - '.github/release-requests/*.txt'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'A build-apk.yml futás azonosítója (Actions → run URL vége), amelynek APK-ját publikáljuk'
        required: true
        type: string
      notes:
        description: 'Opcionális kiegészítő megjegyzés a release-szöveghez'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish prerelease from build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve the request (run_id + notes)
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_NOTES: ${{ inputs.notes }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_id="$INPUT_RUN_ID"
            notes="$INPUT_NOTES"
          else
            if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              changed="$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- '.github/release-requests/*.txt')"
            else
              changed="$(git show --name-only --diff-filter=AM --format= "$AFTER_SHA" -- '.github/release-requests/*.txt')"
            fi
            request_file="$(printf '%s\n' "$changed" | grep -E '^\.github/release-requests/[0-9]+\.txt$' | tail -n 1 || true)"
            if [[ -z "$request_file" ]]; then
              echo "No new release request file in this push; nothing to publish."
              printf 'skip=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id="$(basename "$request_file" .txt)"
            notes="$(cat "$request_file")"
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be numeric, got: $run_id"
            exit 1
          fi
          {
            printf 'skip=false\n'
            printf 'run_id=%s\n' "$run_id"
            printf 'notes<<EOF_NOTES\n%s\nEOF_NOTES\n' "$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the build run
        if: steps.request.outputs.skip != 'true'
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.request.outputs.run_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          workflow_path="$(jq -r '.path' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          if [[ "$workflow_path" != ".github/workflows/build-apk.yml" ]]; then
            echo "::error::Run ${RUN_ID} is not a build-apk.yml run (${workflow_path})."
            exit 1
          fi
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Run ${RUN_ID} did not succeed (conclusion: ${conclusion}); refusing to publish."
            exit 1
          fi
          short_sha="${head_sha:0:7}"
          tag="test-$(date -u +%F)-${short_sha}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists; refusing to overwrite an existing release."
            exit 1
          fi
          {
            printf 'head_sha=%s\n' "$head_sha"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'head_branch=%s\n' "$head_branch"
            printf 'tag=%s\n' "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Download the APK artifact
        if: steps.request.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.request.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p '*-development.apk' -D dist
          apk="$(find dist -type f -name '*.apk' | head -n 1)"
          if [[ -z "$apk" || ! -s "$apk" ]]; then
            echo "::error::No development APK artifact found in run ${RUN_ID}."
            exit 1
          fi
          printf 'apk=%s\n' "$apk" >> "$GITHUB_ENV"

      - name: Create the prerelease
        if: steps.request.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.request.outputs.run_id }}
          NOTES: ${{ steps.request.outputs.notes }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          SHORT_SHA: ${{ steps.run.outputs.short_sha }}
          HEAD_BRANCH: ${{ steps.run.outputs.head_branch }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$apk" | cut -c1-64)"
          size_mb="$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f", b / 1048576 }')"
          asset_name="$(basename "$apk")"
          body="$(printf '%s\n%s\n%s' \
            "Fejlesztői teszt-build (development env: fiók + élő backend + community + preview-all)." \
            "CI: build-apk.yml run ${RUN_ID} zöld. Ág: ${HEAD_BRANCH}. HEAD: ${HEAD_SHA}." \
            "APK: ${asset_name} (${size_mb} MB). SHA-256: ${sha256}.")"
          if [[ -n "${NOTES// /}" ]]; then
            body="$(printf '%s\n\n%s' "$body" "$NOTES")"
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Teszt-APK $(date -u +%F) (${SHORT_SHA})" \
            --notes "$body" \
            "${apk}#strumsight-dev-${SHORT_SHA}.apk"
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset_name}"
